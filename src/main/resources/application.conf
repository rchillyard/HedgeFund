# This configuration file defines the Hedge Fund application data.

# In general, the file application.conf overrides (where appropriate) the file reference.com

# Define the name of this application
name = My Hedge Fund

# Define the application version -- useful to ensure you are actually running the latest
# Note: not necessarily related to the sbt version
appVersion = 1.0.1

portfolio = ${user.home}/portfolio.json
# AlphaVantage requires an API key: export ALPHAVANTAGE_API_KEY=... in your shell before running.
# YQL and Google are kept for their parsing code (see ProviderRegistry) but their endpoints are
# permanently dead -- selecting either of them will not fetch any real data.
engine = AlphaVantage
#engine = Google
#engine = YQL
format = json
symbols = "YHOO,AAPL,GOOG,MSFT"

# Per-symbol price cache entries expire after this long, triggering a fresh fetch on next lookup.
priceCache.ttl = 1 minute

# How often the running portfolio is re-checked for price changes (and buy/sell rules evaluated).
ruleCheck.interval = 10 minutes

akka {
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = INFO
}

